[tool.ruff]
line-length = 100
target-version = "py314"          

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "ASYNC"]   
ignore = ["B008", "BLE001", "SIM102", "B904", "E712"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"              
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the docker-compose stack running"]
addopts = "-ra"